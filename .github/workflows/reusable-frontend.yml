# Issue #409 – Reusable workflow: frontend lint / build / test / perf-budget
# Least-privilege: read-only checkout; no deployment permissions.
name: Frontend CI (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Check translation parity
        run: npm run i18n:check
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Check desktop performance budget
        run: npm run performance:budget
        working-directory: frontend
      - name: Check mobile performance budget
        # Issue #406: separate, tighter budget for mobile bundle size.
        run: npm run performance:budget:mobile
        working-directory: frontend
