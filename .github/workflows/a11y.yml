name: Accessibility

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/a11y.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

# Blocks PRs that introduce new WCAG A/AA violations on critical pages.
jobs:
  axe:
    name: axe-core snapshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run accessibility snapshots (public routes)
        run: npx playwright test e2e/a11y.spec.ts --project=chromium

      # Issue #404: extend axe-core coverage to authenticated routes.
      # The spec seeds a connected-wallet fixture and mocks API calls so the
      # pages render without a live backend.
      - name: Run accessibility snapshots (authenticated routes)
        run: npx playwright test e2e/accessibility-authenticated.spec.ts --project=chromium
