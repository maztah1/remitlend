# Issue #409 – Reusable workflow: end-to-end and mobile performance tests
# Issue #406 – mobile-chrome and mobile-safari Playwright projects run here.
# Least-privilege: read-only checkout; uploads artifacts on failure.
name: E2E Tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers (chromium + mobile webkit)
        # chromium covers desktop + mobile-chrome; webkit covers mobile-safari.
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Run e2e tests – desktop chromium
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
      - name: Run e2e tests – mobile-chrome (Issue #406)
        run: npx playwright test --project=mobile-chrome
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
      - name: Run e2e tests – mobile-safari (Issue #406)
        run: npx playwright test --project=mobile-safari
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
